# Netlify configuration
[build]
  publish = "dist"
  command = "npm run build"

# Git app registration moved to the dedicated site (orbit.runonflux.com).
# 301 the retired internal path so old links/indexed URLs don't 404.
[[redirects]]
  from = "/apps/register/orbit"
  to = "https://orbit.runonflux.com/"
  status = 301
  force = true

# WordPress hosting moved to the dedicated site (wordpress.runonflux.com).
# Exact path only — /marketplace/wordpress/configure keeps serving the deploy funnel.
[[redirects]]
  from = "/marketplace/wordpress"
  to = "https://wordpress.runonflux.com/"
  status = 301
  force = true

# SPA fallback - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Prevent caching of index.html so browsers always fetch the latest version
# (hashed asset filenames handle cache busting for JS/CSS)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must not be cached — browser needs to fetch it to detect updates
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
